apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: greenagent-carbon-autoscaler
  namespace: default
spec:
  scaleTargetRef:
    name: greenagent-os
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-k8s.monitoring.svc:9090
        metricName: greenagent_carbon_grams_total
        threshold: '50'
        query: sum(rate(greenagent_carbon_grams_total[5m]))

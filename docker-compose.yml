version: '3.8'

services:
  greenagent-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenagent-os-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=false
      - DATABASE_URL=sqlite:///./greenagent.db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - greenagent-data:/app/data
    restart: unless-stopped

  frontend-dev:
    image: node:20-slim
    container_name: greenagent-os-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - greenagent-os
    restart: unless-stopped

volumes:
  greenagent-data:
